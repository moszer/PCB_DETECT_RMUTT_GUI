name: AOI checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main_program_for_webapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: main_program_for_webapp/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx next build --webpack

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main_program_for_webapp/backend
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR test dependency
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
        working-directory: .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: main_program_for_webapp/backend/requirements.txt
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
